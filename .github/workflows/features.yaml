name: Features
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gherkin:
    name: Feature binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run features:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-binding-report
          path: reports/features
          if-no-files-found: error
          retention-days: 14
